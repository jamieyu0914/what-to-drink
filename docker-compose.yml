services:
  frontend:
    build: ./frontend
    container_name: vue-frontend
    ports:
      - "5173:5173"  # Vite dev server
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:8088/api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1Qaz2Wsx
      MYSQL_DATABASE: appdb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    depends_on:
      - db
    ports:
      - "8088:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/appdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1Qaz2Wsx

volumes:
  db_data:
