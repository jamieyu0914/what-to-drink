# AWS Configuration for Bedrock AI Service
# Amazon Nova Micro 是最便宜的文本模型 (比 Nova Lite 更經濟)
# Nova Micro: 純文本輸入/輸出，最適合簡單對話和文本生成
# Nova Lite: 支援文本、圖片、視頻輸入，功能更豐富但稍貴
#
# 🔧 .env 文件整合：
# 系統現在會自動載入 .env 文件中的環境變數
# .env 文件中的值會覆蓋下方的預設值
# 請將以下值替換為您的 AWS 憑證：
# 1. ✅ 已在 AWS Console -> IAM -> Users -> 建立新使用者
# 2. ✅ 已附加 AmazonBedrockFullAccess 權限
# 3. ✅ 已在 .env 文件中設置 Access Key
# 4. ✅ 已在 Bedrock Console 中啟用了 Amazon Nova Micro 模型存取權限
# 5. 新用戶可享 AWS 免費方案 (前12個月有免費額度)
aws.access-key-id=${AWS_ACCESS_KEY_ID:your-access-key}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:your-secret-key}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${S3_BUCKET_NAME:your-bucket}

# Server Configuration
server.port=8080

# Multipart Configuration (for file uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration - MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/appdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=DEBUG

# .env 文件載入狀態 (將由 DotenvConfig 自動更新)
# 查看控制台輸出確認 .env 變數載入狀態
